name: Verify Journal

on:
  pull_request:
  push:
    branches: ["codex/HarnassValidation"]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BRONTIDE_VERIFY_REPORT_DIR: ${{ github.workspace }}\artifacts

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/eod/pyproject.toml

      - name: Install Node dependencies
        run: npm ci

      - name: Create isolated EOD environment
        shell: pwsh
        run: |
          python -m venv services/eod/.venv
          services/eod/.venv/Scripts/python.exe -m pip install --disable-pip-version-check -e "./services/eod[dev]"

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run complete verification
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:BRONTIDE_VERIFY_REPORT_DIR -Force | Out-Null
          npm run verify 2>&1 | Tee-Object -FilePath "$env:BRONTIDE_VERIFY_REPORT_DIR/verify.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verification-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: warn
          retention-days: 14
